<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zynergia High-Conversion Landing Page</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />

  <style>
    .protected-content {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #privacy-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    @media print {
      html, body {
        display: none !important;
      }
    }
  </style>
</head>
<body class="protected-content">

  <div id="privacy-overlay">
    <div>
      <h2>Protected Content</h2>
      <p>Content is hidden during window state transitions.</p>
    </div>
  </div>

  <main id="main-content">
    <h1>Confidential Landing Page</h1>
    <p>This content is guarded by client-side event monitoring and styles.</p>
  </main>

  <script>
    (function() {
      const overlay = document.getElementById('privacy-overlay');
      const mainContent = document.getElementById('main-content');

      function hideContent() {
        overlay.style.display = 'flex';
        mainContent.style.visibility = 'hidden';
      }

      function showContent() {
        overlay.style.display = 'none';
        mainContent.style.visibility = 'visible';
      }

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          hideContent();
        } else {
          showContent();
        }
      });

      window.addEventListener('blur', hideContent);
      window.addEventListener('focus', showContent);
    })();
  </script>

  <div id="root"></div>
